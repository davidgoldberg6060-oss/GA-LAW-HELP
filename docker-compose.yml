services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-galaw}
      POSTGRES_USER: ${POSTGRES_USER:-galaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-galaw} -d ${POSTGRES_DB:-galaw}"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-galaw}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-galaw}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "backend.app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-galaw}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-galaw}
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
