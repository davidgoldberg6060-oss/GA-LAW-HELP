<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STANDALONE ASSISTANT – Usage stats</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07101d">
<link rel="icon" href="/icons/icon-192.png">
<meta name="stats-api" content="https://api-production-60cc.up.railway.app">
<style>
:root{--bg:#07101d;--card:#0e1b2e;--line:#2a3c57;--text:#eef3fa;--muted:#b8c6d9;--gold:#e2b54e;--blue:#2f7de1}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
main{max-width:42rem;margin:0 auto;padding:1rem 1rem 3rem}
h1{font-size:1.45rem;margin:.2rem 0 .3rem}
h2{font-size:1.15rem;margin:0 0 .75rem;color:var(--gold)}
h3{font-size:1rem;margin:1rem 0 .4rem;color:var(--muted);font-weight:600}
.sub,.s,.muted,.stamp,#status{color:var(--muted);font-size:.9rem}
.period{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;margin:1rem 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem}
.card{background:#0a1626;border:1px solid var(--line);border-radius:12px;padding:.75rem}
.k{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.v{font-size:1.7rem;font-weight:700;margin:.1rem 0}
.features{list-style:none;margin:0;padding:0}
.features li{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;padding:.35rem 0;border-bottom:1px solid #1c2c42}
.features small{color:var(--muted);font-weight:400}
.chart{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:.5rem;overflow-x:auto}
.bar{flex:1 0 8px;min-width:8px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar .col{width:100%;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px}
.bar span{font-size:8px;color:var(--muted);transform:rotate(-70deg);transform-origin:top left;height:28px;margin-top:6px;white-space:nowrap}
.split{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.comment{border-top:1px solid var(--line);padding:.75rem 0}
.comment .when{font-weight:600}
.comment .meta,.comment .email{color:var(--muted);font-size:.85rem}
.comment p{margin:.35rem 0}
.gate{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.25rem;margin-top:1.5rem}
label{display:block;margin:.5rem 0 .3rem}
input[type=password],input[type=text]{width:100%;padding:.8rem;border-radius:10px;border:1px solid var(--line);background:#07101d;color:var(--text);font-size:1rem;min-height:44px}
button,.btn{display:inline-block;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:.8rem 1.1rem;font-weight:600;min-height:44px;cursor:pointer;margin-top:.7rem}
button.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}
#error,.err{color:#ffb4b4}
@media (max-width:420px){.grid,.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <p class="sub">Owner only</p>
  <h1>How people are using the app</h1>
  <p class="sub">Anonymous counts only. No names, IP addresses, or question text.</p>
  <section id="gate" class="gate" hidden>
    <p>Enter the owner stats token once. It stays on this device.</p>
    <form id="gateForm">
      <label for="token">Stats token</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required>
      <p id="gateError" class="err"></p>
      <button type="submit">Open stats</button>
    </form>
  </section>
  <div id="dash" hidden>
    <p id="stamp" class="stamp"></p>
    <p id="status"></p>
    <div id="content"></div>
    <button type="button" class="secondary" id="logout">Lock this page</button>
  </div>
</main>
<script src="/stats.js"></script>
</body>
</html>
