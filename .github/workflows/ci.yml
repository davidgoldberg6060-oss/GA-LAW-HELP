name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m compileall -q app
      - name: Run backend test suite
        run: pytest -q
        env:
          JWT_SECRET: test-only-secret-at-least-32-characters
          DATABASE_URL: sqlite:///./ci.db
          EVIDENCE_DIR: ./ci-evidence
      - name: Build API image
        working-directory: .
        run: docker build -t ga-law-help-api:ci .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: docker build -f Dockerfile.web -t ga-law-help-web:ci .

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug -PGALAW_API_BASE_URL=https://api-production-60cc.up.railway.app
      - name: Build Android release bundle
        working-directory: android
        run: ./gradlew bundleRelease -PGALAW_API_BASE_URL=https://api-production-60cc.up.railway.app
      - uses: actions/upload-artifact@v4
        # The build above is the check; a full artifact-storage quota must not fail CI.
        continue-on-error: true
        with:
          name: ga-law-help-android-unsigned
          retention-days: 7
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
