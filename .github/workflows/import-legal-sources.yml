name: Import legal sources

# Manual only, sibling of import-supreme-opinions.yml. Preview (default) downloads and parses the
# selected source without touching any database. Commit mode writes to the database in the
# DATABASE_URL repository secret and fails fast if that secret is missing or points at SQLite.
# Nothing here runs on push or on a schedule.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source to import"
        required: true
        default: ocga
        type: choice
        options:
          - ocga
          - courtlistener
          - appeals
          - regulations
          - court_rules
      scope:
        description: "ocga: titles ('16', '16,17' or 'all'); courtlistener: 'ga', 'gactapp' or 'ga,gactapp'; appeals: 'YYYY-MM-DD..YYYY-MM-DD'; regulations: department numbers ('40', '40,111') or 'all'; court_rules: sets ('coa', 'coa,superior') or 'all'"
        required: false
        default: ""
        type: string
      limit:
        description: "Maximum records this run (ocga sections / courtlistener opinions / appeals PDFs / regulation or court rules)"
        required: true
        default: "100"
        type: string
      offset:
        description: "Skip this many records first (resume a later batch)"
        required: true
        default: "0"
        type: string
      courtlistener_release:
        description: "courtlistener only: release tag holding pre-filtered Georgia files (courtlistener-ga-YYYY-MM-DD); blank streams the full 55 GB bulk file"
        required: false
        default: ""
        type: string
      court_rules_release:
        description: "court_rules only: release tag holding official pages saved with --save-pages (court-rules-pages-YYYY-MM-DD), for sites that refuse runner IPs"
        required: false
        default: ""
        type: string
      court_rules_pdf_release:
        description: "court_rules only: release tag holding user-supplied official gasupreme.us PDFs + manifest.json + SHA256SUMS (court-rules-pdfs-YYYY-MM-DD); gasupreme.us is never fetched"
        required: false
        default: ""
        type: string
      commit:
        description: "Persist to the database in secrets.DATABASE_URL (leave unchecked for preview)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: import-legal-sources
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    # The CourtListener opinions bulk file is ~55 GB compressed and is streamed, not stored.
    timeout-minutes: 350
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt

      - name: Restore CourtListener Georgia index cache
        if: ${{ inputs.source == 'courtlistener' }}
        uses: actions/cache@v4
        with:
          path: backend/.import-cache
          key: courtlistener-index-${{ github.run_id }}
          restore-keys: courtlistener-index-

      - name: Fetch pre-filtered CourtListener Georgia files
        if: ${{ inputs.source == 'courtlistener' && inputs.courtlistener_release != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.courtlistener_release }}
        run: |
          if [[ ! "$TAG" =~ ^courtlistener-ga-([0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]; then
            echo "::error::courtlistener_release must look like courtlistener-ga-YYYY-MM-DD"; exit 1
          fi
          bulk_date="${BASH_REMATCH[1]}"
          mkdir -p .import-cache
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D .import-cache --clobber
          ls -la .import-cache
          echo "CL_OPINIONS_FILE=.import-cache/opinions-ga-${bulk_date}.csv.bz2" >> "$GITHUB_ENV"
          echo "CL_BULK_DATE=${bulk_date}" >> "$GITHUB_ENV"

      - name: Fetch saved official court-rules pages
        if: ${{ inputs.source == 'court_rules' && inputs.court_rules_release != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.court_rules_release }}
        run: |
          if [[ ! "$TAG" =~ ^court-rules-pages-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::court_rules_release must look like court-rules-pages-YYYY-MM-DD"; exit 1
          fi
          mkdir -p .import-cache
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "court-rules-pages.tar.gz" -D .import-cache --clobber
          tar -xzf .import-cache/court-rules-pages.tar.gz -C .import-cache
          echo "PAGES_DIR=.import-cache/court-rules-pages" >> "$GITHUB_ENV"

      - name: Fetch user-supplied official court-rules PDFs
        if: ${{ inputs.source == 'court_rules' && inputs.court_rules_pdf_release != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.court_rules_pdf_release }}
        run: |
          if [[ ! "$TAG" =~ ^court-rules-pdfs-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::court_rules_pdf_release must look like court-rules-pdfs-YYYY-MM-DD"; exit 1
          fi
          mkdir -p .import-cache/court-rules-pdfs
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "*.pdf" -p "manifest.json" -p "SHA256SUMS" \
            -D .import-cache/court-rules-pdfs --clobber
          (cd .import-cache/court-rules-pdfs && sha256sum -c SHA256SUMS)
          echo "PDF_DIR=.import-cache/court-rules-pdfs" >> "$GITHUB_ENV"

      - name: Preview import (no database writes)
        if: ${{ !inputs.commit }}
        env:
          SOURCE: ${{ inputs.source }}
          SCOPE: ${{ inputs.scope }}
          LIMIT: ${{ inputs.limit }}
          OFFSET: ${{ inputs.offset }}
        run: bash ../.github/scripts/run-legal-import.sh

      - name: Commit import to DATABASE_URL
        if: ${{ inputs.commit }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOURCE: ${{ inputs.source }}
          SCOPE: ${{ inputs.scope }}
          LIMIT: ${{ inputs.limit }}
          OFFSET: ${{ inputs.offset }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL is not configured. Add it (Settings > Secrets and variables > Actions) before running with commit enabled."
            exit 1
          fi
          case "$DATABASE_URL" in
            sqlite*) echo "::error::DATABASE_URL points at SQLite; refusing to commit an import to a throwaway runner database."; exit 1 ;;
          esac
          source ../.github/scripts/db-url.sh
          bash ../.github/scripts/run-legal-import.sh --commit
