name: Import Supreme Court of Georgia opinions

# Manual only. Preview (default) fetches and parses official opinion PDFs without touching any
# database. Commit mode writes to the database in the DATABASE_URL repository secret and fails
# fast if that secret is not configured. Nothing here runs on push or on a schedule.
on:
  workflow_dispatch:
    inputs:
      year:
        description: "Opinion year on gasupreme.us (e.g. 2026)"
        required: true
        type: string
      limit:
        description: "Maximum PDFs this run (1-500)"
        required: true
        default: "25"
        type: string
      offset:
        description: "Skip this many index entries (resume a later batch)"
        required: true
        default: "0"
        type: string
      commit:
        description: "Persist to the database in secrets.DATABASE_URL (leave unchecked for preview)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: import-supreme-opinions
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt

      - name: Preview import (no database writes)
        if: ${{ !inputs.commit }}
        env:
          YEAR: ${{ inputs.year }}
          LIMIT: ${{ inputs.limit }}
          OFFSET: ${{ inputs.offset }}
        run: python -m app.ingestion.import_supreme_opinions --year "$YEAR" --limit "$LIMIT" --offset "$OFFSET"

      - name: Commit import to DATABASE_URL
        if: ${{ inputs.commit }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YEAR: ${{ inputs.year }}
          LIMIT: ${{ inputs.limit }}
          OFFSET: ${{ inputs.offset }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL is not configured. Add it (Settings > Secrets and variables > Actions) before running with commit enabled."
            exit 1
          fi
          case "$DATABASE_URL" in
            sqlite*) echo "::error::DATABASE_URL points at SQLite; refusing to commit an import to a throwaway runner database."; exit 1 ;;
          esac
          source ../.github/scripts/db-url.sh
          python -m app.ingestion.import_supreme_opinions --year "$YEAR" --limit "$LIMIT" --offset "$OFFSET" --commit
