name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build connected installable APK
        env:
          GALAW_API_BASE_URL: ${{ vars.GALAW_API_BASE_URL }}
        run: |
          API_URL="${GALAW_API_BASE_URL:-https://api-production-60cc.up.railway.app}"
          ./gradlew assembleDebug -PGALAW_API_BASE_URL="$API_URL" --stacktrace

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/GA-LAW-HELP-connected.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GA-LAW-HELP-Android-connected
          path: android/app/build/outputs/apk/debug/GA-LAW-HELP-connected.apk
          if-no-files-found: error
          retention-days: 30
