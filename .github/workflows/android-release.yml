name: Build signed release APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the signed APK to a GitHub release (tag apk-<version>-release)"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/android-release.yml"

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build release APK (signed when secrets are available)
        env:
          GALAW_API_BASE_URL: ${{ vars.GALAW_API_BASE_URL }}
          KEYSTORE_B64: ${{ secrets.GALAW_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.GALAW_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GALAW_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GALAW_RELEASE_KEY_PASSWORD }}
        run: |
          API_URL="${GALAW_API_BASE_URL:-https://api-production-60cc.up.railway.app}"
          ARGS=(-PGALAW_API_BASE_URL="$API_URL")
          if [ -n "$KEYSTORE_B64" ]; then
            KS="$RUNNER_TEMP/release.jks"
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            # Passwords go through ORG_GRADLE_PROJECT_* env vars so they never appear on a command line.
            export ORG_GRADLE_PROJECT_GALAW_RELEASE_KEYSTORE_PATH="$KS"
            export ORG_GRADLE_PROJECT_GALAW_RELEASE_STORE_PASSWORD="$STORE_PASSWORD"
            export ORG_GRADLE_PROJECT_GALAW_RELEASE_KEY_ALIAS="$KEY_ALIAS"
            export ORG_GRADLE_PROJECT_GALAW_RELEASE_KEY_PASSWORD="$KEY_PASSWORD"
          fi
          ./gradlew assembleRelease "${ARGS[@]}" --stacktrace
          ls -l app/build/outputs/apk/release/

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1 || true)
          if [ -z "$APK" ]; then echo "No signed APK (secrets missing?)"; ls app/build/outputs/apk/release/; exit 1; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "Signer|SHA-256"
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp "$APK" "app/build/outputs/apk/release/ga-law-help-$VERSION-release.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-$VERSION-release"
          FILE="app/build/outputs/apk/release/ga-law-help-$VERSION-release.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "GA Law Help $VERSION (signed release)" \
              --notes "Signed release APK for store submission (Samsung Galaxy Store). Same app as $VERSION."
          fi
