name: Database maintenance

# Manual only. Runs against the database in the DATABASE_URL repository secret.
#   status  - read-only: Postgres version, database size, row counts, which backend migrations exist.
#   backup  - schema dump of the whole database plus a data dump of the legal corpus tables,
#             uploaded as a short-lived workflow artifact. Read-only.
#   migrate - takes the same backup first, then applies backend/migrations/*.sql in filename
#             order, each in its own transaction (ON_ERROR_STOP). Every migration is idempotent
#             and additive; nothing is dropped or truncated. Prints status afterwards.
#   search-check - read-only: runs the app's own search_georgia_authorities() for the
#             search_query input and prints the top citations.
#   explain - read-only: EXPLAIN (ANALYZE) of the search queries plus index sizes
#             (.github/scripts/db-explain.sql, default_transaction_read_only=on).
#   search-index - applies migrations, then backfills legal_authorities.search_vector in
#             batches and builds its GIN indexes CONCURRENTLY (.github/scripts/search-index.sql),
#             so the live app is never locked. Idempotent; prints index sizes afterwards.
#   verify-authorities - applies migrations, then records official-source provenance for qualifying
#             authorities in the small authority_verifications side table, in batches with a disk
#             guard (.github/scripts/verify-authorities.sh). Never updates legal_authorities.
#             dry_run=true (default) only reports counts.
#   init-schema - for a brand-new empty database only: creates every application table from the
#             SQLAlchemy models (Base.metadata.create_all, the same thing non-production startup
#             does), then applies backend/migrations in order. create_all only creates missing
#             tables; it never alters or drops existing ones. The Supabase chain in
#             supabase/migrations needs Supabase roles (anon/authenticated, auth.uid()) and does
#             not apply to plain Postgres.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        default: status
        type: choice
        options:
          - status
          - backup
          - migrate
          - init-schema
          - search-check
          - explain
          - search-index
          - verify-authorities
          - space-report
      dry_run:
        description: "verify-authorities only: report counts without inserting"
        required: false
        default: true
        type: boolean
      search_query:
        description: "search-check only: question to search"
        required: false
        default: "carrying a weapon without a license"
        type: string

permissions:
  contents: read

concurrency:
  group: db-maintenance
  cancel-in-progress: false

jobs:
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Status (before)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          source .github/scripts/db-url.sh
          PGCONNECT_TIMEOUT=30 psql "$LIBPQ_URL" -X -f .github/scripts/db-status.sql

      - name: Explain search queries (read-only)
        if: ${{ inputs.action == 'explain' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          source .github/scripts/db-url.sh
          PGOPTIONS='-c default_transaction_read_only=on' psql "$LIBPQ_URL" -X -f .github/scripts/db-explain.sql

      - name: Space report (read-only)
        if: ${{ inputs.action == 'space-report' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          source .github/scripts/db-url.sh
          PGOPTIONS='-c default_transaction_read_only=on' psql "$LIBPQ_URL" -X -f .github/scripts/db-space.sql
          for t in legal_authorities authority_versions legal_sources; do
            cols=$(psql "$LIBPQ_URL" -XAt -c "select string_agg(format('sum(pg_column_size(%I))/1048576 as %I',attname,attname),',') from pg_attribute where attrelid='$t'::regclass and attnum>0 and not attisdropped" 2>/dev/null) || continue
            echo "== column MB in $t"; PGOPTIONS='-c default_transaction_read_only=on' psql "$LIBPQ_URL" -X -x -c "select $cols from $t" || true
          done

      - name: Backup
        if: ${{ inputs.action == 'backup' || inputs.action == 'migrate' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          source .github/scripts/db-url.sh
          mkdir -p db_backup
          pg_dump "$LIBPQ_URL" --schema-only --no-owner --no-privileges -f db_backup/schema.sql
          pg_dump "$LIBPQ_URL" --data-only --no-owner --no-privileges \
            -t 'legal_sources' -t 'legal_authorities' -t 'authority_versions' -t 'authority_annotations*' \
            -Fc -f db_backup/legal_corpus_data.dump
          ls -la db_backup
          # Artifact storage can be over quota, so the schema is also kept in this run's log.
          echo "::group::schema.sql"; cat db_backup/schema.sql; echo "::endgroup::"

      - name: Upload backup artifact
        if: ${{ inputs.action == 'backup' || inputs.action == 'migrate' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: db-backup-${{ github.run_id }}
          path: db_backup/
          retention-days: 14

      - uses: actions/setup-python@v5
        if: ${{ inputs.action == 'init-schema' || inputs.action == 'search-check' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Create application tables (create_all)
        if: ${{ inputs.action == 'init-schema' }}
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install -q -r requirements.txt
          source ../.github/scripts/db-url.sh
          python - <<'PY'
          import app.models  # registers every table on Base.metadata
          from app.database import Base, engine, verify_production_schema
          Base.metadata.create_all(bind=engine)
          verify_production_schema()
          print("create_all ok:", len(Base.metadata.tables), "tables")
          PY

      - name: Apply backend migrations
        if: ${{ inputs.action == 'migrate' || inputs.action == 'init-schema' || inputs.action == 'search-index' || (inputs.action == 'verify-authorities' && !inputs.dry_run) }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          source .github/scripts/db-url.sh
          for f in $(ls backend/migrations/*.sql | sort); do
            echo "::group::Applying $f"
            psql "$LIBPQ_URL" -X -v ON_ERROR_STOP=1 --single-transaction -f "$f"
            echo "::endgroup::"
          done

      - name: Build search index (batched backfill + CREATE INDEX CONCURRENTLY)
        if: ${{ inputs.action == 'search-index' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          source .github/scripts/db-url.sh
          psql "$LIBPQ_URL" -X -v ON_ERROR_STOP=1 -f .github/scripts/search-index.sql
          PGOPTIONS='-c default_transaction_read_only=on' psql "$LIBPQ_URL" -X -f .github/scripts/db-explain.sql

      - name: Verify authorities (official-source provenance)
        if: ${{ inputs.action == 'verify-authorities' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          source .github/scripts/db-url.sh
          if [ "$DRY_RUN" = "true" ]; then export PGOPTIONS='-c default_transaction_read_only=on'; fi
          bash .github/scripts/verify-authorities.sh
          unset PGOPTIONS
          psql "$LIBPQ_URL" -X -f .github/scripts/spot-check-sections.sql || true

      - name: Status (after)
        if: ${{ inputs.action == 'migrate' || inputs.action == 'init-schema' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          source .github/scripts/db-url.sh
          psql "$LIBPQ_URL" -X -f .github/scripts/db-status.sql

      - name: Search check (app search service)
        if: ${{ inputs.action == 'search-check' }}
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEARCH_QUERY: ${{ inputs.search_query }}
        run: |
          pip install -q -r requirements.txt
          source ../.github/scripts/db-url.sh
          python - <<'PY'
          import os
          from app.database import SessionLocal
          from app.authority_search_service import search_georgia_authorities
          import time
          from sqlalchemy import func
          from app.models import LegalAuthority
          from app.authority_search_service import public_law_search, search_vector_ready
          query = os.environ["SEARCH_QUERY"]
          with SessionLocal() as db:
              print("search_vector_ready:", search_vector_ready(db))
              for label, fn in (
                  ("laws", lambda: public_law_search(db, kind="statutes", keyword=query, limit=25)),
                  ("cases", lambda: search_georgia_authorities(db, query, limit=25, filters=(func.lower(LegalAuthority.authority_type).notin_(("statute", "regulation", "court_rule")),))),
              ):
                  t = time.perf_counter(); rows = fn()
                  print(f"{label}: {len(rows)} rows in {time.perf_counter() - t:.3f}s; top: {[r.citation for r in rows[:5]]}")
              t = time.perf_counter()
              hits = search_georgia_authorities(db, query, limit=10)
              print(f"all-types: {time.perf_counter() - t:.3f}s")
          print(f"query={query!r} hits={len(hits)}")
          for h in hits:
              print(f"- [{h.authority_type}] {h.citation} | {(h.title or '')[:80]} | {h.source_url}")
          PY
