name: Database maintenance

# Manual only. Runs against the database in the DATABASE_URL repository secret.
#   status  - read-only: Postgres version, database size, row counts, which backend migrations exist.
#   backup  - schema dump of the whole database plus a data dump of the legal corpus tables,
#             uploaded as a short-lived workflow artifact. Read-only.
#   migrate - takes the same backup first, then applies backend/migrations/*.sql in filename
#             order, each in its own transaction (ON_ERROR_STOP). Every migration is idempotent
#             and additive; nothing is dropped or truncated. Prints status afterwards.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        default: status
        type: choice
        options:
          - status
          - backup
          - migrate

permissions:
  contents: read

concurrency:
  group: db-maintenance
  cancel-in-progress: false

jobs:
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Status (before)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          source .github/scripts/db-url.sh
          PGCONNECT_TIMEOUT=30 psql "$LIBPQ_URL" -X -f .github/scripts/db-status.sql

      - name: Backup
        if: ${{ inputs.action == 'backup' || inputs.action == 'migrate' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          source .github/scripts/db-url.sh
          mkdir -p db_backup
          pg_dump "$LIBPQ_URL" --schema-only --no-owner --no-privileges -f db_backup/schema.sql
          pg_dump "$LIBPQ_URL" --data-only --no-owner --no-privileges \
            -t 'legal_sources' -t 'legal_authorities' -t 'authority_versions' -t 'authority_annotations*' \
            -Fc -f db_backup/legal_corpus_data.dump
          ls -la db_backup
          # Artifact storage can be over quota, so the schema is also kept in this run's log.
          echo "::group::schema.sql"; cat db_backup/schema.sql; echo "::endgroup::"

      - name: Upload backup artifact
        if: ${{ inputs.action == 'backup' || inputs.action == 'migrate' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: db-backup-${{ github.run_id }}
          path: db_backup/
          retention-days: 14

      - name: Apply backend migrations
        if: ${{ inputs.action == 'migrate' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          source .github/scripts/db-url.sh
          for f in $(ls backend/migrations/*.sql | sort); do
            echo "::group::Applying $f"
            psql "$LIBPQ_URL" -X -v ON_ERROR_STOP=1 --single-transaction -f "$f"
            echo "::endgroup::"
          done

      - name: Status (after)
        if: ${{ inputs.action == 'migrate' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          source .github/scripts/db-url.sh
          psql "$LIBPQ_URL" -X -f .github/scripts/db-status.sql
